services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: back-overhaul-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://root:password@db:5432/appdb
    depends_on:
      - db
    volumes:
      - .:/app

  db:
    image: postgres:16-alpine
    container_name: back-overhaul-postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

